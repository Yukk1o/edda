name: build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # verify 包含单元测试与 ArchUnit 边界规则,失败即拦住
      - name: Build and verify
        run: mvn -B -ntp verify
